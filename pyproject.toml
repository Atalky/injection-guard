[project]
name = "injection-guard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Atal Yousafzai", email = "atalkhany@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.0.1",
    "jupyter>=1.1.1",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[project.scripts]
injection-guard = "injection_guard:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
